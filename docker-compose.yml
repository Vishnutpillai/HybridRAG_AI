services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: hybrid-rag-backend

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - ./data:/app/data

    restart: unless-stopped


  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    container_name: hybrid-rag-frontend

    environment:
      RAG_API_URL: http://backend:8000

    ports:
      - "8501:8501"

    depends_on:
      - backend

    restart: unless-stopped